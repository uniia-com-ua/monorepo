name: CI

# Runs on every PR into main: builds landing and strapi Docker images with the
# same Dockerfiles as the Release workflow, without pushing. Catches build
# breakage before merge, instead of at tag time.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-strapi:
    name: Build strapi (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build strapi image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/strapi/Dockerfile
          push: false
          cache-from: type=gha,scope=strapi
          cache-to: type=gha,mode=max,scope=strapi
          platforms: linux/amd64

  build-landing:
    name: Build landing (staging config, no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build landing image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/landing/Dockerfile
          push: false
          build-args: |
            STRAPI_URL=https://cms-test.uniia.com.ua
            STRAPI_API_TOKEN=${{ secrets.STRAPI_API_TOKEN_STAGING }}
            NEXT_PUBLIC_SITE_URL=https://test.uniia.com.ua
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing
          platforms: linux/amd64
