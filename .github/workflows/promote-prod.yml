name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to promote (e.g. v0.1.0). Must already exist (built on staging via the Release workflow)."
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  deploy-strapi-prod:
    name: Deploy Strapi to Production
    needs: version
    runs-on: [self-hosted, uniia-deploy]
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Update strapi-prod stack
        uses: ./.github/actions/portainer-deploy
        with:
          portainer-url: ${{ secrets.PORTAINER_URL }}
          api-token: ${{ secrets.PORTAINER_API_TOKEN }}
          stack-id: ${{ secrets.PORTAINER_STRAPI_PROD_STACK_ID }}
          endpoint-id: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          tag-env-name: STRAPI_TAG
          new-tag: ${{ needs.version.outputs.version }}

      - name: Wait for production Strapi
        uses: ./.github/actions/wait-health
        with:
          url: https://cms.uniia.com.ua/_health
          expected-status: "204"

  build-landing-prod:
    name: Build landing production image
    needs: [version, deploy-strapi-prod]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push landing production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/landing/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/landing:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository }}/landing:latest
          build-args: |
            STRAPI_URL=https://cms.uniia.com.ua
            STRAPI_API_TOKEN=${{ secrets.STRAPI_API_TOKEN_PROD }}
            NEXT_PUBLIC_SITE_URL=https://uniia.com.ua
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing
          platforms: linux/amd64

  deploy-landing-prod:
    name: Deploy landing to Production
    needs: [version, build-landing-prod]
    runs-on: [self-hosted, uniia-deploy]
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Update landing-prod stack
        uses: ./.github/actions/portainer-deploy
        with:
          portainer-url: ${{ secrets.PORTAINER_URL }}
          api-token: ${{ secrets.PORTAINER_API_TOKEN }}
          stack-id: ${{ secrets.PORTAINER_LANDING_PROD_STACK_ID }}
          endpoint-id: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          tag-env-name: LANDING_TAG
          new-tag: ${{ needs.version.outputs.version }}
