name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p')

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, using all commits"
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "Generating changelog from $PREVIOUS_TAG to ${{ steps.version.outputs.tag }}"
            COMMITS=$(git log "$PREVIOUS_TAG".."${{ steps.version.outputs.tag }}" --pretty=format:"- %s (%h)" --no-merges)
          fi

          {
            echo "notes<<EOF"
            echo "## What's Changed"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG:-$(git rev-list --max-parents=0 HEAD | head -1)}...${{ steps.version.outputs.tag }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-strapi:
    name: Build Strapi image
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Strapi image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/strapi/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/strapi:${{ needs.release.outputs.version }}
          cache-from: type=gha,scope=strapi
          cache-to: type=gha,mode=max,scope=strapi
          platforms: linux/amd64

  deploy-strapi-staging:
    name: Deploy Strapi to Staging
    needs: [release, build-strapi]
    runs-on: [self-hosted, uniia-deploy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update strapi-staging stack
        uses: ./.github/actions/portainer-deploy
        with:
          portainer-url: ${{ secrets.PORTAINER_URL }}
          api-token: ${{ secrets.PORTAINER_API_TOKEN }}
          stack-id: ${{ secrets.PORTAINER_STRAPI_STAGING_STACK_ID }}
          endpoint-id: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          tag-env-name: STRAPI_TAG
          new-tag: ${{ needs.release.outputs.version }}

      - name: Wait for staging Strapi
        uses: ./.github/actions/wait-health
        with:
          url: https://cms-test.uniia.com.ua/_health
          expected-status: "204"

  build-landing-staging:
    name: Build landing staging image
    needs: [release, deploy-strapi-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push landing staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/landing/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/landing:${{ needs.release.outputs.version }}-staging
          build-args: |
            STRAPI_URL=https://cms-test.uniia.com.ua
            STRAPI_API_TOKEN=${{ secrets.STRAPI_API_TOKEN_STAGING }}
            NEXT_PUBLIC_SITE_URL=https://test.uniia.com.ua
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing
          platforms: linux/amd64

  deploy-landing-staging:
    name: Deploy landing to Staging
    needs: [release, build-landing-staging]
    runs-on: [self-hosted, uniia-deploy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update landing-staging stack
        uses: ./.github/actions/portainer-deploy
        with:
          portainer-url: ${{ secrets.PORTAINER_URL }}
          api-token: ${{ secrets.PORTAINER_API_TOKEN }}
          stack-id: ${{ secrets.PORTAINER_LANDING_STAGING_STACK_ID }}
          endpoint-id: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          tag-env-name: LANDING_TAG
          new-tag: ${{ needs.release.outputs.version }}-staging
