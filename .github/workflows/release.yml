name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build, Release & Publish Staging Image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Extract version info from tag ---
      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Generate changelog from commits since last tag ---
      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p')

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, using all commits"
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "Generating changelog from $PREVIOUS_TAG to ${{ steps.version.outputs.tag }}"
            COMMITS=$(git log "$PREVIOUS_TAG".."${{ steps.version.outputs.tag }}" --pretty=format:"- %s (%h)" --no-merges)
          fi

          {
            echo "notes<<EOF"
            echo "## What's Changed"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG:-$(git rev-list --max-parents=0 HEAD | head -1)}...${{ steps.version.outputs.tag }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # --- Create GitHub Release ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Build the Next.js "landing" app against the STAGING Strapi and push to GHCR ---
      # Next.js statically pre-renders pages at build time, so the image is baked
      # against one specific Strapi instance. Staging and production are therefore
      # built as separate images (see promote-prod.yml for the production build).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/landing/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-staging
          build-args: |
            STRAPI_URL=https://cms-test.uniia.com.ua
            STRAPI_API_TOKEN=${{ secrets.STRAPI_API_TOKEN_STAGING }}
            NEXT_PUBLIC_SITE_URL=https://test.uniia.com.ua
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # --- Auto-deploy the freshly built staging image (production stays manual, see promote-prod.yml) ---
  deploy-staging:
    name: Auto-deploy to Staging
    needs: build-and-release
    runs-on: [self-hosted, uniia-deploy]
    steps:
      - name: Update landing-staging stack in Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          STACK_ID: ${{ secrets.PORTAINER_LANDING_STAGING_STACK_ID }}
          ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          NEW_TAG: ${{ needs.build-and-release.outputs.version }}-staging
        run: |
          set -euo pipefail

          echo "Deploying landing:${NEW_TAG} to staging (stack ${STACK_ID})"

          FILE=$(curl -sk -f -H "X-API-Key: ${PORTAINER_API_TOKEN}" \
            "${PORTAINER_URL}/api/stacks/${STACK_ID}/file" | jq -r '.StackFileContent')

          ENV_JSON=$(curl -sk -f -H "X-API-Key: ${PORTAINER_API_TOKEN}" \
            "${PORTAINER_URL}/api/stacks/${STACK_ID}" \
            | jq --arg tag "${NEW_TAG}" '.Env | map(if .name=="LANDING_TAG" then .value=$tag else . end)')

          PAYLOAD=$(jq -n --arg file "${FILE}" --argjson env "${ENV_JSON}" \
            '{stackFileContent:$file, env:$env, prune:false, pullImage:true}')

          curl -sk -f -X PUT -H "X-API-Key: ${PORTAINER_API_TOKEN}" -H "Content-Type: application/json" \
            "${PORTAINER_URL}/api/stacks/${STACK_ID}?endpointId=${ENDPOINT_ID}" -d "${PAYLOAD}"

          echo "Staging redeploy triggered."
